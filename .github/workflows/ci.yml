# Integração contínua: a cada push, compila o projeto e roda todos os testes
# contra um MongoDB descartável (o Atlas real NÃO é usado aqui).
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar e testar
        run: mvn -B verify
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DATABASE: loginseguro_teste
