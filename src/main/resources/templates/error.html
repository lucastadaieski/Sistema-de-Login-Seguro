<!DOCTYPE html>
<!-- Página genérica para os demais erros (400, 500...). Não exibe detalhes técnicos. -->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head>
    <title>Erro</title>
</head>
<body>
<section layout:fragment="conteudo">
    <div class="cartao formulario centralizado">
        <h1 th:text="${status}">Erro</h1>
        <h2>Algo deu errado</h2>
        <p>Não foi possível concluir a operação. Tente novamente.</p>
        <a class="botao" th:href="@{/}">Ir para o início</a>
    </div>
</section>
</body>
</html>
