<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/base}">
<head>
    <title>Usuários</title>
</head>
<body>
<section layout:fragment="conteudo">
    <h1>Gerenciar usuários</h1>
    <p class="subtitulo" th:unless="${souAdmin}">
        Como moderador, você pode ativar ou desativar contas de usuários comuns.
    </p>
    <p class="subtitulo" th:if="${souAdmin}">
        Como administrador, você também pode alterar perfis e excluir contas.
    </p>

    <div class="tabela-container">
        <table class="tabela">
            <thead>
            <tr>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Perfil</th>
                <th>Situação</th>
                <th>Último acesso</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.nome}">Nome</td>
                <td th:text="${u.email}">email</td>
                <td><span class="etiqueta" th:text="${u.perfil.descricao}">Usuário</span></td>
                <td>
                    <span th:if="${!u.ativo}" class="etiqueta etiqueta-erro">Inativa</span>
                    <span th:if="${u.ativo and u.bloqueado}" class="etiqueta etiqueta-alerta">Bloqueada</span>
                    <span th:if="${u.ativo and !u.bloqueado}" class="etiqueta etiqueta-ok">Ativa</span>
                </td>
                <td th:text="${@datas.formatar(u.ultimoLogin)}">-</td>
                <td class="acoes-tabela">
                    <span th:if="${u.email == emailLogado}" class="dica">(você)</span>

                    <!-- Ativar/desativar: moderador só em contas USUARIO; admin em qualquer outra -->
                    <form th:if="${u.email != emailLogado and (souAdmin or u.perfil.name() == 'USUARIO')}"
                          th:action="@{/moderador/usuarios/{id}/status(id=${u.id})}" method="post" class="form-inline">
                        <input type="hidden" name="ativo" th:value="${!u.ativo}">
                        <button type="submit" class="botao botao-pequeno botao-secundario"
                                th:text="${u.ativo} ? 'Desativar' : 'Ativar'">Desativar</button>
                    </form>

                    <!-- Ações exclusivas do ADMIN (as rotas /admin/** também são protegidas no servidor) -->
                    <th:block sec:authorize="hasRole('ADMIN')" th:if="${u.email != emailLogado}">
                        <form th:action="@{/admin/usuarios/{id}/perfil(id=${u.id})}" method="post" class="form-inline">
                            <select name="perfil" aria-label="Perfil">
                                <option th:each="p : ${perfis}" th:value="${p}" th:text="${p.descricao}"
                                        th:selected="${p == u.perfil}">Usuário</option>
                            </select>
                            <button type="submit" class="botao botao-pequeno">Alterar</button>
                        </form>
                        <form th:action="@{/admin/usuarios/{id}/excluir(id=${u.id})}" method="post"
                              class="form-inline" data-confirmar="Excluir esta conta definitivamente?">
                            <button type="submit" class="botao botao-pequeno botao-perigo">Excluir</button>
                        </form>
                    </th:block>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <script th:src="@{/js/confirmar.js}"></script>
</section>
</body>
</html>
