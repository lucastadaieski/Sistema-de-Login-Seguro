<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head>
    <title>Criar conta</title>
</head>
<body>
<section layout:fragment="conteudo">
    <div class="cartao formulario">
        <h1>Criar conta</h1>

        <!-- th:object liga o formulário ao CadastroForm; os erros vêm do Bean Validation -->
        <form th:action="@{/cadastro}" th:object="${cadastroForm}" method="post" novalidate>
            <label for="nome">Nome</label>
            <input type="text" id="nome" th:field="*{nome}" autocomplete="name"
                   th:classappend="${#fields.hasErrors('nome')} ? 'campo-erro'">
            <span class="msg-erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>

            <label for="email">E-mail</label>
            <input type="email" id="email" th:field="*{email}" autocomplete="username"
                   th:classappend="${#fields.hasErrors('email')} ? 'campo-erro'">
            <span class="msg-erro" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

            <!-- Campos de senha sem th:field: a senha nunca é devolvida ao navegador -->
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" autocomplete="new-password"
                   th:classappend="${#fields.hasErrors('senha')} ? 'campo-erro'">
            <span class="dica">Mínimo de 8 caracteres, com letra maiúscula, letra minúscula e número.</span>
            <span class="msg-erro" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></span>

            <label for="confirmacaoSenha">Confirmar senha</label>
            <input type="password" id="confirmacaoSenha" name="confirmacaoSenha" autocomplete="new-password"
                   th:classappend="${#fields.hasErrors('senhasConferem') or #fields.hasErrors('confirmacaoSenha')} ? 'campo-erro'">
            <span class="msg-erro" th:if="${#fields.hasErrors('confirmacaoSenha')}" th:errors="*{confirmacaoSenha}"></span>
            <span class="msg-erro" th:if="${#fields.hasErrors('senhasConferem')}" th:errors="*{senhasConferem}"></span>

            <button type="submit" class="botao botao-largo">Cadastrar</button>
        </form>

        <p class="rodape-form">Já tem conta? <a th:href="@{/login}">Entrar</a></p>
    </div>
</section>
</body>
</html>
