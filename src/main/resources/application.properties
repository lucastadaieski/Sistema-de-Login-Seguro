# =====================================================================
#  Login Seguro - configuração principal
#
#  NENHUMA credencial fica escrita neste arquivo. Os valores sensíveis
#  vêm de variáveis de ambiente ou do arquivo ".env" na raiz do projeto
#  (que está no .gitignore e nunca vai para o GitHub).
#  Modelo do .env: veja o arquivo ".env.example".
# =====================================================================

spring.application.name=login-seguro

# Carrega o arquivo .env da raiz do projeto, se ele existir
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------------
#  MongoDB Atlas
#  A URI usa o esquema mongodb+srv://, que ativa TLS automaticamente.
# ---------------------------------------------------------------------
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:loginseguro}
# Cria automaticamente os índices declarados nas classes (ex.: e-mail único)
spring.data.mongodb.auto-index-creation=true

# ---------------------------------------------------------------------
#  Sessões HTTP gravadas no MongoDB (Spring Session)
#  Permite rodar várias instâncias da aplicação sem perder o login.
# ---------------------------------------------------------------------
spring.session.mongodb.collection-name=sessoes
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Em produção (HTTPS) defina COOKIE_SECURE=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ---------------------------------------------------------------------
#  Thymeleaf
#  Cache desligado facilita editar templates/temas durante o desenvolvimento.
# ---------------------------------------------------------------------
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# ---------------------------------------------------------------------
#  Temas visuais
#  Para criar um tema novo basta adicionar a pasta
#  static/temas/<nome>/tema.css e incluir <nome> na lista abaixo.
# ---------------------------------------------------------------------
app.temas.padrao=${TEMA_PADRAO:claro}
app.temas.disponiveis=claro,escuro,alto-contraste

# ---------------------------------------------------------------------
#  Proteção contra força bruta
# ---------------------------------------------------------------------
app.seguranca.max-tentativas=5
app.seguranca.minutos-bloqueio=15

# ---------------------------------------------------------------------
#  Administrador inicial (criado só se ainda não existir nenhum ADMIN)
# ---------------------------------------------------------------------
app.admin.nome=${ADMIN_NOME:Administrador}
app.admin.email=${ADMIN_EMAIL:}
app.admin.senha=${ADMIN_PASSWORD:}

# Páginas de erro próprias (templates/error/*.html)
server.error.whitelabel.enabled=false
